<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Paint Chat</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <h1>🎨Paint Chat</h1>

  <p class="subtitle">
    Step into the painting
  </p> 

  <p class="choose-painting">
    Select a painting and choose a character to begin a conversation.
  </p>

  <div class="paintings">

    <!-- Painting 1 -->
    <div class="card" onclick="selectPainting('Stolen Interview')">

      <img src="images/stolen.jpg">

      <p>Stolen Interview</p>

    </div>

    <!-- Painting 2 -->
    <div class="card" onclick="selectPainting('Damayanti and the Swan')">

      <img src="images/damayanti.jpg">

      <p>Damayanti and the Swan</p>

    </div>

    <!-- Painting 3 -->
    <div class="card" onclick="selectPainting('Mohini on a Swing')">

      <img src="images/mohini.jpg">

      <p>Mohini on a Swing</p>

    </div>

  </div>

  <div class="chat-section">

    <h2 id="selectedPainting">
    </h2>

    <p class="character-text">
      Choose a character from the painting
    </p>

    <select id="characterSelect"></select>

    <textarea
      id="messageInput"
      placeholder="Enter your message..."
    ></textarea>

    <button onclick="sendMessage()">
      Send
    </button>

    <div id="replyBox">
      The character reply will appear here...
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
